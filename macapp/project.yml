name: Agents
options:
  bundleIdPrefix: com.kirahowe
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

# The app's user-visible name, and the single source of truth for everything
# that has to differ between a dev build and a release build. Defined at
# project scope rather than on the Agents target because AgentsTests needs it
# too, for TEST_HOST: the test host IS the app bundle, so the moment the
# bundle's on-disk name became config-dependent, the test target had to be
# able to spell that name as well.
#
# Consumed three ways, which must all agree — if they diverge, macOS shows a
# name in one place that contradicts another:
#   - CFBundleName / CFBundleDisplayName, via the Agents target's
#     `info: properties:` below
#   - WRAPPER_NAME, i.e. the .app directory name on disk
#   - AgentsTests' TEST_HOST path
#
# Deliberately NOT plumbed through INFOPLIST_KEY_CFBundleDisplayName /
# INFOPLIST_KEY_CFBundleName, which cannot override the CFBundleName key
# xcodegen's `info:` block already bakes in — see the GENERATE_INFOPLIST_FILE
# comment on the Agents target for the full story.
settings:
  configs:
    Debug:
      AGENTS_APP_DISPLAY_NAME: "Agents Dev"
    Release:
      AGENTS_APP_DISPLAY_NAME: "Agents"

packages:
  libghostty-spm:
    url: https://github.com/Lakr233/libghostty-spm
    exactVersion: 1.5.20260903
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.5

targets:
  Agents:
    type: application
    platform: macOS
    sources:
      - path: Agents
      - path: ../cli/agents-cli
        buildPhase: resources
    dependencies:
      - package: libghostty-spm
        product: GhosttyTerminal
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kirahowe.agents
        # PRODUCT_NAME stays "Agents" in BOTH configs so the executable
        # inside the bundle is always Contents/MacOS/Agents. Only the
        # wrapper — the .app directory name, which is what macOS actually
        # shows the user — varies by config, via WRAPPER_NAME below.
        # Renaming the executable too would buy nothing visible while
        # forcing every consumer of the binary path (CFBundleExecutable,
        # AgentsTests' TEST_HOST) to become config-dependent as well.
        PRODUCT_NAME: Agents
        # WRAPPER_NAME is what makes a dev build distinguishable from a
        # release build in macOS's own UI. CFBundleName and
        # CFBundleDisplayName alone are NOT enough: TCC permission prompts —
        # and anything else that falls back to a bundle's filename rather
        # than its Info.plist — showed both builds identically as
        # "Agents.app", so a Documents/Desktop access prompt gave no clue
        # which build had triggered it. Overriding the wrapper name (rather
        # than PRODUCT_NAME) renames only the .app directory, leaving the
        # executable and every path derived from it untouched.
        WRAPPER_NAME: "$(AGENTS_APP_DISPLAY_NAME).app"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        # GENERATE_INFOPLIST_FILE: NO — deliberately, after testing both
        # values against the actual built product. With YES, Xcode forces
        # THREE keys unconditionally from build settings regardless of the
        # source Info.plist's own content: CFBundleShortVersionString (from
        # MARKETING_VERSION), CFBundleVersion (from CURRENT_PROJECT_VERSION),
        # and — confirmed by direct testing, and not documented anywhere
        # obvious — CFBundleName (from PRODUCT_NAME). That last one silently
        # clobbers this target's per-config CFBundleName override (Debug
        # needs "Agents Dev", but PRODUCT_NAME must stay "Agents" in both
        # configs — see its own comment above). With NO, none of those three
        # get auto-populated, so all three are instead explicit
        # $(VAR)-substituted entries in `info: properties:` below — plain
        # Xcode variable substitution, which is unconditional in both
        # directions (GENERATE_INFOPLIST_FILE YES or NO) and was verified
        # against the real built Debug and Release Info.plists to correctly
        # track MARKETING_VERSION/CURRENT_PROJECT_VERSION per build
        # (including the nightly workflow's
        # `CURRENT_PROJECT_VERSION="$BUILD"` xcodebuild override, which
        # Sparkle's appcast version comparison depends on) while ALSO
        # letting CFBundleName differ Debug vs Release.
        #
        # The other reason NO was needed: INFOPLIST_KEY_* settings (the
        # normal partner of GENERATE_INFOPLIST_FILE: YES) only ADD keys
        # absent from the source Info.plist — they silently drop
        # empty-string values entirely, and can never override a key the
        # file already defines. INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # was silently dropped under YES for exactly this reason. Every key
        # this app needs is therefore a literal (or $(VAR)-substituted)
        # entry directly in `info: properties:` below instead — unambiguous,
        # and every single one was confirmed present in both built products.
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        DEAD_CODE_STRIPPING: YES
      configs:
        # AGENTS_APP_DISPLAY_NAME, which drives both the CFBundle*Name keys
        # and WRAPPER_NAME above, is set per-config at PROJECT scope (top of
        # this file) so AgentsTests can read it too.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.kirahowe.agents.dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.kirahowe.agents
    info:
      path: Info-Agents.plist
      properties:
        # Explicit $(VAR) placeholders, overriding xcodegen's own
        # hardcoded-literal defaults for these two keys ("1.0" / "1",
        # ignoring MARKETING_VERSION/CURRENT_PROJECT_VERSION entirely) — see
        # the GENERATE_INFOPLIST_FILE comment above for why plain substitution
        # here, rather than relying on GENERATE_INFOPLIST_FILE: YES's forced
        # override, is what actually gets this right in both configs.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: $(AGENTS_APP_DISPLAY_NAME)
        CFBundleName: $(AGENTS_APP_DISPLAY_NAME)
        NSHumanReadableCopyright: ""
        LSApplicationCategoryType: public.app-category.developer-tools
        SUFeedURL: https://github.com/kirahowe/agent-sessions/releases/download/nightly/appcast.xml
        SUPublicEDKey: gdTi9dNGbLv8jE9+yuWIkOQgQMiNTuc8rOgBEZWnYh8=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false

  AgentsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AgentsTests
    dependencies:
      - target: Agents
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kirahowe.agents.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        # The app bundle's directory name is config-dependent (see
        # WRAPPER_NAME on the Agents target), so this can't hardcode
        # "Agents.app" — the test scheme builds Debug, where the bundle is
        # "Agents Dev.app". The executable inside it is named "Agents" in
        # both configs, hence the plain trailing MacOS/Agents.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/$(AGENTS_APP_DISPLAY_NAME).app/Contents/MacOS/Agents"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO

schemes:
  Agents:
    build:
      targets:
        Agents: all
        AgentsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgentsTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
