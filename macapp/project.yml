name: Agents
options:
  bundleIdPrefix: com.kirahowe
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  libghostty-spm:
    url: https://github.com/Lakr233/libghostty-spm
    exactVersion: 1.3.2

targets:
  Agents:
    type: application
    platform: macOS
    sources:
      - path: Agents
      - path: ../cli/agents-cli
        buildPhase: resources
    dependencies:
      - package: libghostty-spm
        product: GhosttyTerminal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kirahowe.agents
        PRODUCT_NAME: Agents
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        DEAD_CODE_STRIPPING: YES

  AgentsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AgentsTests
    dependencies:
      - target: Agents
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kirahowe.agents.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Agents.app/Contents/MacOS/Agents"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO

schemes:
  Agents:
    build:
      targets:
        Agents: all
        AgentsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgentsTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
